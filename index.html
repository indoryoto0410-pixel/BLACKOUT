<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLACKOUT ONLINE</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#09090d;
 color:#eee;
 font-family:system-ui,-apple-system,sans-serif
}

#app{
 max-width:1100px;
 margin:auto;
 padding:18px
}

.top{
 display:flex;
 justify-content:space-between;
 gap:12px;
 align-items:center
}

h1{
 margin:0;
 letter-spacing:6px
}

.sub{
 color:#888
}

.panel,.zone{
 background:#14141b;
 border:1px solid #292934;
 border-radius:16px;
 padding:16px;
 margin-top:14px
}

.row{
 display:flex;
 gap:10px;
 align-items:center;
 flex-wrap:wrap
}

.input{
 background:#0e0e13;
 color:#fff;
 border:1px solid #444;
 border-radius:9px;
 padding:11px;
 width:180px
}

.btn{
 background:#eee;
 color:#111;
 border:0;
 border-radius:9px;
 padding:11px 15px;
 font-weight:800;
 cursor:pointer
}

.btn.dark{
 background:#222;
 color:#eee;
 border:1px solid #444
}

.btn:disabled{
 opacity:.35;
 cursor:not-allowed
}

.status{
 display:flex;
 justify-content:space-between;
 gap:12px
}

.hp{
 font-size:22px
}

.role{
 font-weight:800
}

.hand{
 display:flex;
 gap:9px;
 flex-wrap:wrap
}

.card{
 width:145px;
 min-height:165px;
 background:#1c1c25;
 border:1px solid #3a3a48;
 border-radius:13px;
 padding:10px;
 cursor:pointer;
 transition:.15s
}

.card:hover{
 transform:translateY(-5px)
}

.card.sel{
 border:2px solid #fff;
 transform:translateY(-7px)
}

.card.locked{
 opacity:.45;
 cursor:not-allowed;
 transform:none
}

.icon{
 text-align:center;
 font-size:40px;
 margin-top:15px
}

.name{
 text-align:center;
 font-weight:800;
 margin:7px 0
}

.desc{
 text-align:center;
 font-size:11px;
 color:#aaa;
 line-height:1.35
}

.chips{
 color:#bbb;
 margin-top:10px
}

.log{
 background:#08080b;
 border-radius:12px;
 padding:12px;
 min-height:120px;
 max-height:210px;
 overflow:auto;
 line-height:1.55;
 font-size:13px
}

.vs{
 text-align:center;
 font-size:26px;
 letter-spacing:6px;
 color:#777;
 margin:10px
}

.played{
 min-height:70px;
 text-align:center;
 font-size:20px;
 padding:15px;
 border:1px dashed #444;
 border-radius:10px
}

.notice{
 text-align:center;
 font-weight:700;
 margin:10px 0
}

.small{
 font-size:12px;
 color:#999
}

.hidden{
 display:none
}

.good{
 color:#7dffb2
}
</style>
</head>

<body>

<div id="app">

<div class="top">
 <div>
  <h1>BLACKOUT</h1>
  <div class="sub">ONLINE — 2 PLAYER</div>
 </div>
 <div id="roomLabel" class="small"></div>
</div>

<div id="lobby" class="panel">

 <div class="row">
  <button class="btn" id="create">部屋を作る</button>

  <input
   id="code"
   class="input"
   placeholder="部屋コード"
  >

  <button class="btn dark" id="join">参加する</button>
 </div>

 <div id="lobbyMsg" class="notice">
  友達と遊ぶには、どちらかが部屋を作ってください。
 </div>

</div>


<div id="game" class="hidden">

<div class="panel">

 <div class="status">

  <div>
   <div id="meRole" class="role"></div>
   <div id="meHp" class="hp"></div>
   <div id="meChips" class="chips"></div>
  </div>

  <div style="text-align:right">
   <div id="opRole" class="role"></div>
   <div id="opHp" class="hp"></div>
   <div id="opInfo" class="chips"></div>
  </div>

 </div>

 <div class="vs">VS</div>

 <div class="played" id="played">
  両者のセットを待っています
 </div>

 <div id="notice" class="notice"></div>

</div>


<div class="zone">

 <div class="row" style="justify-content:space-between">
  <b>あなたの手札</b>
  <span id="handCount" class="small"></span>
 </div>

 <div id="hand" class="hand"></div>

 <div id="chipsButtons"
      class="row"
      style="margin-top:10px">
 </div>

 <div class="row" style="margin-top:12px">

  <button
   class="btn"
   id="action">
   カードをセット
  </button>

 </div>

</div>


<div class="panel">

 <b>BATTLE LOG</b>

 <div id="log" class="log"></div>

</div>

</div>

</div>


<script>

const $=id=>document.getElementById(id);

let session=null;
let state=null;
let selected=null;
let selectedChip=null;
let lastVersion=0;

const cardNames={};


function esc(s){
 return String(s).replace(
  /[&<>"']/g,
  m=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[m])
 );
}


async function api(url,opts){

 const r=await fetch(url,opts);

 const j=await r.json();

 if(!r.ok){
  throw new Error(j.error||'エラー');
 }

 return j;
}


/* =========================
   ROOM
========================= */

$('create').onclick=async()=>{

 try{

  const j=await api(
   '/api/create',
   {method:'POST'}
  );

  session={...j};
  state=j.state;

  showGame();

  $('lobbyMsg').innerHTML=
   `部屋コード：<b>${j.code}</b>　このコードを友達に送ってください。`;

  poll();

 }catch(e){

  $('lobbyMsg').textContent=e.message;

 }

};


$('join').onclick=async()=>{

 try{

  const code=$('code').value.trim().toUpperCase();

  const j=await api(
   '/api/join',
   {
    method:'POST',
    headers:{
     'Content-Type':'application/json'
    },
    body:JSON.stringify({code})
   }
  );

  session={...j};
  state=j.state;

  showGame();
  poll();

 }catch(e){

  $('lobbyMsg').textContent=e.message;

 }

};


function showGame(){

 $('lobby').classList.add('hidden');

 $('game').classList.remove('hidden');

 $('roomLabel').textContent=
  'ROOM '+session.code;

 render();

}


/* =========================
   RENDER
========================= */

function render(){

 if(!state)return;

 const me=state.players[0];
 const op=state.players[1];

 const myTurn=state.turn===state.me;

 const phase=state.phase;

 const revealed=phase==='reveal';

 const myChosen=!!state.myChosen;

 const opponentChosen=!!state.opponentChosen;


 $('meHp').textContent='❤️ '+me.hp;

 $('opHp').textContent='❤️ '+op.hp;


 $('meChips').textContent=
  'チップ：'+
  (
   me.chips.length
   ?
   me.chips.map(
    x=>x==='sure'
     ?'🎯必中'
     :'✖️一石二鳥'
   ).join(' ')
   :'なし'
  );


 $('opInfo').textContent=
  '手札 '+(op.handCount??0)+'枚';


 /* 役割 */

 if(revealed){

  $('meRole').textContent='⚡ REVEAL';

  $('opRole').textContent='⚡ REVEAL';

 }else if(myTurn){

  $('meRole').textContent=
   '⚔️ 攻撃側 — セットしてください';

  $('opRole').textContent=
   '🛡️ 防御側 — セットしてください';

 }else{

  $('meRole').textContent=
   '🛡️ 防御側 — セットしてください';

  $('opRole').textContent=
   '⚔️ 攻撃側 — セットしてください';

 }


 /* 通知 */

 if(state.gameOver){

  $('notice').textContent='ゲーム終了';

 }else if(state.playersReady<2){

  $('notice').textContent=
   '相手の参加を待っています…';

 }else if(revealed){

  $('notice').textContent=
   '⚡ カード公開！';

 }else if(myChosen){

  $('notice').textContent=
   '✓ セット完了 — 相手のセットを待っています…';

 }else{

  $('notice').textContent=
   myTurn
   ?'攻撃カードをセットしてください'
   :'防御カードをセットしてください';

 }


 /* 手札 */

 $('hand').innerHTML='';

 state.players[0].hand.forEach((k)=>{

  const c=
   cardNames[k]||
   {
    icon:'🃏',
    name:k,
    desc:'',
    type:''
   };

  const isCorrect=
   myTurn
   ?c.type==='attack'
   :c.type==='defense';

  const locked=
   myChosen||
   !isCorrect||
   state.gameOver||
   revealed;

  const d=document.createElement('div');

  d.className=
   'card'+
   (selected===k?' sel':'')+
   (locked?' locked':'');

  d.innerHTML=
   `<div class="icon">${c.icon}</div>
    <div class="name">${esc(c.name)}</div>
    <div class="desc">${esc(c.desc)}</div>`;

  d.onclick=()=>{

   if(locked)return;

   selected=k;
   selectedChip=null;

   render();

  };

  $('hand').appendChild(d);

 });


 $('handCount').textContent=
  '('+state.players[0].hand.length+'枚)';


 /* チップ */

 $('chipsButtons').innerHTML='';

 if(
  !myChosen &&
  !revealed &&
  myTurn &&
  selected==='roulette'
 ){

  for(
   const [x,t]
   of [
    ['sure','🎯 必中'],
    ['double','✖️ 一石二鳥']
   ]
  ){

   const b=document.createElement('button');

   b.className='btn dark';

   b.textContent=t;

   b.disabled=
    !state.players[0].chips.includes(x);

   if(selectedChip===x){
    b.style.outline='2px solid white';
   }

   b.onclick=()=>{

    selectedChip=
     selectedChip===x
      ?null
      :x;

    render();

   };

   $('chipsButtons').appendChild(b);

  }

 }


 /* 決定ボタン */

const hasDefense = state.players[0].hand.some(k =>
  cardNames[k]?.type === 'defense'
);

$('action').disabled=
   (!selected && !( !myTurn && !hasDefense )) ||
   myChosen||
   state.gameOver||
   revealed;
$('action').textContent=
   myChosen
    ?'セット済み'
    :(!myTurn && !hasDefense
      ?'防御なしでセット'
      :'カードをセット');


 /* 公開表示 */

 if(revealed){

  const attackName=
   cardNames[state.attackCard]?.name||
   state.attackCard;

  const defenseName=
   cardNames[state.defenseCard]?.name||
   state.defenseCard;

  $('played').innerHTML=
   `⚔️ ${esc(attackName)}
   　VS　
    🛡️ ${esc(defenseName)}`;

 }else{

  let text='';

  if(myChosen&&opponentChosen){

   text='⚡ REVEAL準備中…';

  }else if(myChosen){

   text='あなたはセット済み';

  }else if(opponentChosen){

   text='相手はセット済み';

  }else{

   text='両者のセットを待っています';

  }

  $('played').textContent=text;

 }


 /* LOG */

 $('log').innerHTML=
  state.log
   .map(x=>`<div>${esc(x)}</div>`)
   .join('');

 $('log').scrollTop=
  $('log').scrollHeight;

}


/* =========================
   ACTION
========================= */

$('action').onclick=async()=>{

const myTurn=state.turn===state.me;
const hasDefense=state.players[0].hand.some(k =>
  cardNames[k]?.type === 'defense'
);

if(!selected && (myTurn || hasDefense)) return;

 try{

  const payload={
   code:session.code,
   token:session.token,
   card:selected
  };

  if(selectedChip){
   payload.chip=selectedChip;
  }

  const j=await api(
   '/api/action',
   {
    method:'POST',
    headers:{
     'Content-Type':'application/json'
    },
    body:JSON.stringify(payload)
   }
  );

  state=j.state;

  selected=null;
  selectedChip=null;

  render();

 }catch(e){

  $('notice').textContent=e.message;

 }

};


/* =========================
   POLLING
========================= */

async function poll(){

 try{

  const j=await api(
   `/api/state?code=${
    encodeURIComponent(session.code)
   }&token=${
    encodeURIComponent(session.token)
   }`
  );

  if(j.version!==lastVersion){

   lastVersion=j.version;

   state=j;

   render();

  }

 }catch(e){}

 setTimeout(poll,700);

}


/* =========================
   CARD DATA
========================= */

(async()=>{

 try{

  const j=
   await fetch('/cards.json');

  Object.assign(
   cardNames,
   await j.json()
  );

  render();

 }catch(e){}

})();

</script>

</body>
</html>
