<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACKOUT ONLINE</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090d;color:#eee;font-family:system-ui,-apple-system,sans-serif}#app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0;letter-spacing:6px}.sub{color:#888}.panel,.zone{background:#14141b;border:1px solid #292934;border-radius:16px;padding:16px;margin-top:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.input{background:#0e0e13;color:#fff;border:1px solid #444;border-radius:9px;padding:11px;width:180px}.btn{background:#eee;color:#111;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.btn.dark{background:#222;color:#eee;border:1px solid #444}.btn:disabled{opacity:.35;cursor:not-allowed}.status{display:flex;justify-content:space-between;gap:12px}.hp{font-size:22px}.role{font-weight:800}.hand{display:flex;gap:9px;flex-wrap:wrap}.card{width:145px;min-height:165px;background:#1c1c25;border:1px solid #3a3a48;border-radius:13px;padding:10px;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-5px)}.card.sel{border:2px solid #fff;transform:translateY(-7px)}.card.disabled{opacity:.45;cursor:default}.icon{text-align:center;font-size:40px;margin-top:15px}.name{text-align:center;font-weight:800;margin:7px 0}.desc{text-align:center;font-size:11px;color:#aaa;line-height:1.35}.chips{color:#bbb;margin-top:10px}.log{background:#08080b;border-radius:12px;padding:12px;min-height:120px;max-height:210px;overflow:auto;line-height:1.55;font-size:13px}.vs{text-align:center;font-size:26px;letter-spacing:6px;color:#777;margin:10px}.played{min-height:54px;text-align:center;font-size:20px;padding:10px;border:1px dashed #444;border-radius:10px}.notice{text-align:center;font-weight:700;margin:10px 0}.small{font-size:12px;color:#999}.hidden{display:none}.danger{color:#ff6464}.good{color:#7dffb2}</style></head><body><div id="app">
<div class="top"><div><h1>BLACKOUT</h1><div class="sub">ONLINE — 2 PLAYER</div></div><div id="roomLabel" class="small"></div></div>
<div id="lobby" class="panel"><div class="row"><button class="btn" id="create">部屋を作る</button><input id="code" class="input" placeholder="部屋コード"><button class="btn dark" id="join">参加する</button></div><div id="lobbyMsg" class="notice">友達と遊ぶには、どちらかが部屋を作ってください。</div></div>
<div id="game" class="hidden"><div class="panel"><div class="status"><div><div id="meRole" class="role"></div><div id="meHp" class="hp"></div><div id="meChips" class="chips"></div></div><div style="text-align:right"><div id="opRole" class="role"></div><div id="opHp" class="hp"></div><div id="opInfo" class="chips"></div></div></div><div class="vs">VS</div><div class="played" id="played">待機中</div><div id="notice" class="notice"></div></div>
<div class="zone"><div class="row" style="justify-content:space-between"><b>あなたの手札</b><span id="handCount" class="small"></span></div><div id="hand" class="hand"></div><div id="chipsButtons" class="row" style="margin-top:10px"></div><div class="row" style="margin-top:12px"><button class="btn" id="action">カードを決定</button></div></div>
<div class="panel"><b>BATTLE LOG</b><div id="log" class="log"></div></div></div></div>
<script>
const $=id=>document.getElementById(id);let session=null,state=null,selected=null,selectedChip=null,lastVersion=0,autoPending=false;
const cardNames={};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(url,opts){let r=await fetch(url,opts);let j=await r.json();if(!r.ok)throw new Error(j.error||'エラー');return j}
$('create').onclick=async()=>{try{const j=await api('/api/create',{method:'POST'});session={...j};state=j.state;lastVersion=state.version;showGame();$('lobbyMsg').innerHTML=`部屋コード：<b>${j.code}</b>　このコードを友達に送ってください。`;poll()}catch(e){$('lobbyMsg').textContent=e.message}}
$('join').onclick=async()=>{try{const code=$('code').value.trim().toUpperCase();const j=await api('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});session={...j};state=j.state;lastVersion=state.version;showGame();poll()}catch(e){$('lobbyMsg').textContent=e.message}}
function showGame(){$('lobby').classList.add('hidden');$('game').classList.remove('hidden');$('roomLabel').textContent='ROOM '+session.code;render()}
async function submit(card=null,chip=null){try{const payload={code:session.code,token:session.token,card};if(chip)payload.chip=chip;const j=await api('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});state=j.state;lastVersion=state.version;selected=null;selectedChip=null;autoPending=false;render()}catch(e){autoPending=false;$('notice').textContent=e.message}}
function maybeAutoPass(){
 if(autoPending||!state||state.gameOver||state.playersReady<2||state.turn!==state.me)return;
 const me=state.players[0];
 const attack=state.phase==='attack';
 const none=attack ? (me.skip || !me.hand.some(k=>cardNames[k]?.type==='attack')) : !me.hand.some(k=>cardNames[k]?.type==='defense');
 if(!none)return;
 autoPending=true;$('notice').textContent=attack?'攻撃カードがないため自動でターン終了…':'防御カードがないため攻撃が通ります…';
 setTimeout(()=>submit(null,null),450);
}
function render(){if(!state)return;const me=state.players[0],op=state.players[1];const myTurn=state.turn===state.me;const attack=state.phase==='attack';$('meHp').textContent='❤️ '+me.hp;$('opHp').textContent='❤️ '+op.hp;$('meChips').textContent='チップ：'+(me.chips.length?me.chips.map(x=>x==='sure'?'🎯必中':'✖️一石二鳥').join(' '):'なし');$('opInfo').textContent='手札 '+op.handCount+'枚';$('meRole').textContent=myTurn?(attack?'⚔️ あなたの攻撃ターン':'🛡️ あなたの防御ターン'):'待機中';$('opRole').textContent=!myTurn?(attack?'⚔️ 相手の攻撃ターン':'🛡️ 相手の防御ターン'):'待機中';$('notice').textContent=state.gameOver?'ゲーム終了':(state.playersReady<2?'相手の参加を待っています…':myTurn?(me.skip&&attack?'🔥 バースト効果：この攻撃ターンはスキップされます':attack?'攻撃カードを選んでください':'防御カードを選んでください'):'相手の操作を待っています…');$('hand').innerHTML='';state.players[0].hand.forEach((k,i)=>{const c=cardNames[k]||{icon:'🃏',name:k,desc:'',type:''};const usable=myTurn&&!state.gameOver&&((attack&&c.type==='attack')||(!attack&&c.type==='defense'));const d=document.createElement('div');d.className='card'+(selected===k?' sel':'')+(usable?'':' disabled');d.innerHTML=`<div class="icon">${c.icon}</div><div class="name">${esc(c.name)}</div><div class="desc">${esc(c.desc)}</div>`;if(usable)d.onclick=()=>{selected=k;selectedChip=null;render()};$('hand').appendChild(d)});$('handCount').textContent='('+state.players[0].hand.length+'枚)';$('chipsButtons').innerHTML='';if(attack&&selected==='roulette'&&myTurn){for(const [x,t] of [['sure','🎯 必中'],['double','✖️ 一石二鳥']]){const b=document.createElement('button');b.className='btn dark';b.textContent=t+' '+state.players[0].chips.filter(v=>v===x).length;b.disabled=!state.players[0].chips.includes(x);if(selectedChip===x)b.style.outline='2px solid white';b.onclick=()=>{selectedChip=selectedChip===x?null:x;render()};$('chipsButtons').appendChild(b)}}$('action').disabled=!myTurn||!selected||state.gameOver||me.skip;$('action').textContent=attack?'攻撃を決定':'防御を決定';$('played').textContent=state.attackCard?`⚔️ ${cardNames[state.attackCard]?.name||state.attackCard}`:'待機中';$('log').innerHTML=state.log.map(x=>`<div>${esc(x)}</div>`).join('');$('log').scrollTop=$('log').scrollHeight;maybeAutoPass()}
$('action').onclick=()=>submit(selected,selectedChip);
async function poll(){try{const j=await api(`/api/state?code=${encodeURIComponent(session.code)}&token=${encodeURIComponent(session.token)}`);if(j.version!==lastVersion){lastVersion=j.version;state=j;selected=null;selectedChip=null;render()}}catch(e){}setTimeout(poll,700)}
(async()=>{try{const j=await fetch('/cards.json');Object.assign(cardNames,await j.json())}catch(e){}})();
</script></body></html>
